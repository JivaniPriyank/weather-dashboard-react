<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hover check – The German Lab</title>
<style>
  body { margin: 0; padding: 40px 24px; font-family: "Segoe UI", system-ui, sans-serif; background: #F7F8F6; color: #18203A; }
  main { max-width: 640px; margin: 0 auto; display: grid; gap: 18px; }
  h1 { margin: 0; font-size: 1.8rem; }
  .row { display: flex; justify-content: space-between; gap: 16px; padding: 14px 18px; border-radius: 12px; background: #fff; border: 1px solid #DDE2EA; font-size: 1.05rem; }
  .yes { color: #1F7A4D; font-weight: 700; } .no { color: #B8283B; font-weight: 700; }
  .box { padding: 28px; border-radius: 16px; background: #fff; border: 2px solid #DDE2EA; text-align: center; font-weight: 600; font-size: 1.1rem; transition: transform .25s, box-shadow .25s, border-color .2s, background-color .2s; }
  .box:hover { background: #EAEEFB; border-color: #2742A8; transform: translateY(-6px); box-shadow: 0 18px 36px -12px rgba(39,66,168,.45); }
  .note { color: #4B556B; }
</style>
</head>
<body>
<main>
  <h1>Hover check</h1>
  <p class="note">Take a screenshot of this page and send it to Claude.</p>
  <div class="row"><span>A mouse or touchpad can hover</span><b id="anyhover"></b></div>
  <div class="row"><span>Main pointer is a mouse</span><b id="hover"></b></div>
  <div class="row"><span>Windows "Animation effects" switched off</span><b id="reduce"></b></div>
  <div class="row"><span>Browser</span><span id="ua" class="note" style="font-size:.85rem;text-align:right"></span></div>
  <div class="box" id="test">Move the mouse over this box: it should turn blue and lift up.</div>
  <p class="note" id="seen">Hover over the box once.</p>
</main>
<script>
  const show = (id, q) => { const v = matchMedia(q).matches; const el = document.getElementById(id); el.textContent = v ? "yes" : "no"; el.className = v ? "yes" : "no"; };
  show("anyhover", "(any-hover: hover)");
  show("hover", "(hover: hover) and (pointer: fine)");
  show("reduce", "(prefers-reduced-motion: reduce)");
  document.getElementById("ua").textContent = navigator.userAgent.replace(/^Mozilla\/5\.0 /, "");
  document.getElementById("test").addEventListener("mouseenter", () => {
    document.getElementById("seen").textContent = "The browser noticed the mouse over the box.";
  });
</script>
</body>
</html>
